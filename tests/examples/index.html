<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uranium WebAssembly Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: slideUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            margin-top: 0;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .code-block {
            background: rgba(15, 23, 42, 0.6);
            padding: 1rem;
            border-radius: 12px;
            font-family: monospace;
            color: #a78bfa;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        .result-box {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 1.5rem;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .result-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.2);
        }

        .result-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            font-weight: 700;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .loading {
            font-size: 1.2rem;
            color: var(--text-muted);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Uranium AOT to WASM</h1>
    <p>This web page dynamically loads a <code>.wasm</code> file compiled entirely by the custom Uranium C++ JIT Engine.</p>
    
    <div class="code-block">
        // math.ur<br>
        (15.5 * 10.0) + 45.0
    </div>

    <div class="result-box">
        <span class="result-label">WebAssembly Result</span>
        <span class="result-value" id="output">
            <span class="loading">Loading Engine...</span>
        </span>
    </div>
</div>

<script>
    async function loadUraniumWasm() {
        try {
            // Fetch the WASM binary generated by Uranium
            const response = await fetch('output.wasm');
            const bytes = await response.arrayBuffer();
            
            // Instantiate the WebAssembly module
            const { instance } = await WebAssembly.instantiate(bytes);
            
            // Call the exported 'main' function
            const result = instance.exports.main();
            
            // Display the result
            document.getElementById('output').innerHTML = result;
            
            console.log("Uranium WASM execution successful!");
            console.log("Result:", result);
            
        } catch (error) {
            console.error("WASM Load Error:", error);
            document.getElementById('output').innerHTML = `<span style="color: #f87171; font-size: 1.2rem;">Compilation Error</span>`;
        }
    }

    // Add a slight delay for dramatic effect
    setTimeout(loadUraniumWasm, 800);
</script>

</body>
</html>
